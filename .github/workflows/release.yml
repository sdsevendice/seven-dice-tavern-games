name: Publish Foundry module

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build module archive
        run: zip -r module.zip assets lang scripts styles templates module.json README.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" module.json module.zip --title "Seven Dice Tavern Games ${GITHUB_REF_NAME}" --generate-notes
