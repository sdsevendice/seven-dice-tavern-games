name: Publish Foundry module

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build module archive
        run: |
          node --check scripts/main.mjs
          node --check scripts/quick-games.mjs
          node tests/engine.test.mjs
          node tests/quick-engine.test.mjs
          node tests/poker-session.test.mjs
          node -e 'const m = require("./module.json"); if (process.env.GITHUB_REF_NAME !== "v" + m.version) process.exit(1);'
          zip -r module.zip assets lang scripts styles templates module.json README.md CHANGELOG.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" module.json module.zip --title "Seven Dice Tavern Games ${GITHUB_REF_NAME}" --generate-notes
